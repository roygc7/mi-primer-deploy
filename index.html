<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi primera página</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #87ceeb, #d6f3ff);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(2px, 1vh, 6px);
      user-select: none;
      width: 100%;
      padding: 6px 0;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      color: #2d2d6b;
      font-size: clamp(1.1rem, 5vw, 1.8rem);
      text-shadow: 1px 1px 0 #fff;
      text-align: center;
    }

    .instructions {
      margin: 0;
      color: #3d3d5c;
      font-size: clamp(0.75rem, 3vw, 0.95rem);
      text-align: center;
      padding: 0 10px;
    }

    #score {
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: bold;
      color: #ff6f3c;
    }

    #canvas-holder {
      position: relative;
      line-height: 0;
    }

    canvas {
      background: linear-gradient(180deg, #bdeeff 0%, #eafff0 68%, #8fd67a 68%, #8fd67a 100%);
      border: 4px solid #4b3f72;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      touch-action: manipulation;
      display: block;
    }

    #gameover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(20, 15, 40, 0.6);
      color: #fff;
      border-radius: 12px;
      text-align: center;
      padding: 0 16px;
    }

    #gameover h2 {
      margin: 0;
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      color: #ffd166;
    }

    #gameover p {
      margin: 0;
      font-size: clamp(0.8rem, 3vw, 0.95rem);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <h1>Mi primer juego</h1>
    <p class="instructions">Toca o presiona espacio para saltar</p>
    <div id="score">Puntos: 0</div>
    <div id="canvas-holder">
      <canvas id="game"></canvas>
      <div id="gameover" class="hidden">
        <h2>¡Choque!</h2>
        <p id="finalScore"></p>
        <p>Toca o presiona espacio para reiniciar</p>
      </div>
    </div>
  </div>

    const player = { x: 60, y: 0, w: 40, h: 46, vy: 0, jumping: false };

    let obstacles = [];
    let speed = 5;
    let frame = 0;
    let score = 0;
    let gameOver = false;
    let ready = false;

    const OBSTACLE_TYPES = [
      { w: 22, h: 32, color: '#ff5d5d' },
      { w: 30, h: 22, color: '#7c4dff' },
      { w: 18, h: 46, color: '#ffb703' },
    ];

    function fitCanvas() {
      const wrap = document.getElementById('game-wrap');
      const reserved = wrap.querySelector('h1').offsetHeight
        + wrap.querySelector('.instructions').offsetHeight
        + scoreEl.offsetHeight + 40;
      const maxW = Math.min(window.innerWidth * 0.94, 560);
      const maxH = Math.max(window.innerHeight - reserved, 160);
      const scale = Math.min(maxW / LOGICAL_W, maxH / LOGICAL_H);

      canvas.style.width = Math.round(LOGICAL_W * scale) + 'px';
      canvas.style.height = Math.round(LOGICAL_H * scale) + 'px';

      const dpr = window.devicePixelRatio || 1;
      canvas.width = LOGICAL_W * dpr;
      canvas.height = LOGICAL_H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (gameOver || !frame) drawFrame();
    }

    function resetGame() {
      player.y = groundY - player.h;
      player.vy = 0;
      player.jumping = false;
      obstacles = [];
      speed = 5;
      frame = 0;
      score = 0;
      gameOver = false;
      gameoverEl.classList.add('hidden');
      updateScore();
      requestAnimationFrame(loop);
    }

    function updateScore() {
      scoreEl.textContent = `Puntos: ${score}`;
    }

    function jump() {
      if (!ready) return;
      if (gameOver) {
        resetGame();
        return;
      }
      if (!player.jumping) {
        player.vy = JUMP_V;
        player.jumping = true;
      }
    }

    function spawnObstacle() {
      const t = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
      obstacles.push({ x: LOGICAL_W + 20, y: groundY - t.h, w: t.w, h: t.h, color: t.color, passed: false });
    }

    function rectsOverlap(a, b) {
      const padX = 10;
      const padY = 4;
      return a.x + padX < b.x + b.w && a.x + a.w - padX > b.x && a.y + padY < b.y + b.h && a.y + a.h > b.y;
    }

    function drawScene() {
      ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

      ctx.fillStyle = '#fff6c8';
      ctx.beginPath();
      ctx.arc(LOGICAL_W - 50, 45, 24, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#3f6626';
      ctx.fillRect(0, groundY, LOGICAL_W, LOGICAL_H - groundY);
      ctx.strokeStyle = '#2d4d1c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(LOGICAL_W, groundY);
      ctx.stroke();
    }

    function drawObstacles() {
      obstacles.forEach(o => {
        ctx.fillStyle = o.color;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x + o.w / 2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.closePath();
        ctx.fill();
      });
    }

    function drawPlayer() {
      if (!sprite.complete || !sprite.naturalWidth) return;
      const { x, y, w, h } = player;
      const tilt = player.jumping ? -0.15 : 0;
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(tilt);
      ctx.drawImage(sprite, -w / 2, -h / 2, w, h);
      ctx.restore();
    }

    function drawFrame() {
      drawScene();
      drawObstacles();
      drawPlayer();
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = `Puntuación final: ${score}`;
      gameoverEl.classList.remove('hidden');
    }

    function loop() {
      if (gameOver) return;
      frame++;

      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y > groundY - player.h) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.jumping = false;
      }

      const spawnGap = Math.max(75 - speed * 5, 45);
      if (frame % Math.round(spawnGap) === 0) spawnObstacle();

      obstacles.forEach(o => (o.x -= speed));
      obstacles = obstacles.filter(o => o.x + o.w > -10);

      for (const o of obstacles) {
        if (!o.passed && o.x + o.w < player.x) {
          o.passed = true;
          score++;
          updateScore();
          if (score % 5 === 0) speed += 0.4;
        }
        if (rectsOverlap(player, o)) {
          endGame();
        }
      }

      drawFrame();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        jump();
      }
    });
    window.addEventListener('mousedown', jump);
    window.addEventListener('touchstart', e => {
      e.preventDefault();
      jump();
    }, { passive: false });

    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', fitCanvas);

    function start() {
      player.h = 46;
      player.w = sprite.naturalWidth ? player.h * (sprite.naturalWidth / sprite.naturalHeight) : 40;
      ready = true;
      fitCanvas();
      resetGame();
    }

    if (sprite.complete) {
      start();
    } else {
      sprite.onload = start;
    }
  </script>
