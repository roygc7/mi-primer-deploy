<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi primera página</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-wrap">
    <h1>Mi primer juego</h1>
    <p class="instructions">Toca o presiona espacio para saltar</p>
    <div id="canvas-holder">
      <div id="score">Puntos: 0</div>
      <canvas id="game"></canvas>
      <div id="gameover" class="hidden">
        <h2>¡Choque!</h2>
        <p id="finalScore"></p>
        <div id="gameoverControls">
          <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="20" autocomplete="off">
          <button id="saveScoreBtn" type="button">Guardar puntaje</button>
          <p id="saveScoreMsg" class="hidden"></p>
        </div>
        <p>Toca o presiona espacio para reiniciar</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
