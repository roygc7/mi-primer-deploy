<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi primera página</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #87ceeb, #d6f3ff);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    h1 {
      margin: 4px 0 0;
      color: #2d2d6b;
      font-size: 1.8rem;
      text-shadow: 1px 1px 0 #fff;
    }

    .instructions {
      margin: 0 0 4px;
      color: #3d3d5c;
      font-size: 0.95rem;
    }

    #score {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ff6f3c;
    }

    #canvas-holder {
      position: relative;
    }

    canvas {
      background: linear-gradient(180deg, #bdeeff 0%, #eafff0 68%, #8fd67a 68%, #8fd67a 100%);
      border: 4px solid #4b3f72;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      max-width: 92vw;
      height: auto;
      display: block;
    }

    #gameover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(20, 15, 40, 0.6);
      color: #fff;
      border-radius: 12px;
      text-align: center;
      padding: 0 16px;
    }

    #gameover h2 {
      margin: 0;
      font-size: 1.6rem;
      color: #ffd166;
    }

    #gameover p {
      margin: 0;
      font-size: 0.95rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <h1>Mi primer juego</h1>
    <p class="instructions">Toca o presiona espacio para saltar</p>
    <div id="score">Puntos: 0</div>
    <div id="canvas-holder">
      <canvas id="game" width="480" height="320"></canvas>
      <div id="gameover" class="hidden">
        <h2>¡Choque!</h2>
        <p id="finalScore"></p>
        <p>Toca o presiona espacio para reiniciar</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameoverEl = document.getElementById('gameover');
    const finalScoreEl = document.getElementById('finalScore');

    const W = canvas.width;
    const H = canvas.height;
    const groundY = H - 46;
    const GRAVITY = 0.9;
    const JUMP_V = -14;

    const player = { x: 60, y: 0, w: 34, h: 40, vy: 0, jumping: false };

    let obstacles = [];
    let speed = 5;
    let frame = 0;
    let score = 0;
    let gameOver = false;

    const OBSTACLE_TYPES = [
      { w: 22, h: 32, color: '#ff5d5d' },
      { w: 30, h: 22, color: '#7c4dff' },
      { w: 18, h: 46, color: '#ffb703' },
    ];

    function resetGame() {
      player.y = groundY - player.h;
      player.vy = 0;
      player.jumping = false;
      obstacles = [];
      speed = 5;
      frame = 0;
      score = 0;
      gameOver = false;
      gameoverEl.classList.add('hidden');
      updateScore();
      requestAnimationFrame(loop);
    }

    function updateScore() {
      scoreEl.textContent = `Puntos: ${score}`;
    }

    function jump() {
      if (gameOver) {
        resetGame();
        return;
      }
      if (!player.jumping) {
        player.vy = JUMP_V;
        player.jumping = true;
      }
    }

    function spawnObstacle() {
      const t = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
      obstacles.push({ x: W + 20, y: groundY - t.h, w: t.w, h: t.h, color: t.color, passed: false });
    }

    function rectsOverlap(a, b) {
      const pad = 6;
      return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x && a.y + pad < b.y + b.h && a.y + a.h > b.y;
    }

    function drawScene() {
      ctx.clearRect(0, 0, W, H);

      ctx.fillStyle = '#fff6c8';
      ctx.beginPath();
      ctx.arc(W - 50, 45, 24, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#3f6626';
      ctx.fillRect(0, groundY, W, H - groundY);
      ctx.strokeStyle = '#2d4d1c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(W, groundY);
      ctx.stroke();
    }

    function drawObstacles() {
      obstacles.forEach(o => {
        ctx.fillStyle = o.color;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x + o.w / 2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.closePath();
        ctx.fill();
      });
    }

    function drawPlayer() {
      const { x, y, w, h } = player;
      const legSwing = player.jumping ? 0 : Math.sin(frame * 0.35) * 6;

      ctx.fillStyle = '#e85d2f';
      ctx.fillRect(x + 5, y + h - 10 + Math.max(0, legSwing), 8, 10);
      ctx.fillRect(x + w - 13, y + h - 10 + Math.max(0, -legSwing), 8, 10);

      ctx.fillStyle = '#ffb703';
      roundedRect(x, y + h * 0.28, w, h * 0.5, 7);
      ctx.fill();

      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + h * 0.18, w * 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2d2d6b';
      ctx.beginPath();
      ctx.arc(x + w * 0.62, y + h * 0.15, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function endGame() {
      gameOver = true;
      finalScoreEl.textContent = `Puntuación final: ${score}`;
      gameoverEl.classList.remove('hidden');
    }

    function loop() {
      if (gameOver) return;
      frame++;

      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y > groundY - player.h) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.jumping = false;
      }

      const spawnGap = Math.max(75 - speed * 5, 45);
      if (frame % Math.round(spawnGap) === 0) spawnObstacle();

      obstacles.forEach(o => (o.x -= speed));
      obstacles = obstacles.filter(o => o.x + o.w > -10);

      for (const o of obstacles) {
        if (!o.passed && o.x + o.w < player.x) {
          o.passed = true;
          score++;
          updateScore();
          if (score % 5 === 0) speed += 0.4;
        }
        if (rectsOverlap(player, o)) {
          endGame();
        }
      }

      drawScene();
      drawObstacles();
      drawPlayer();

      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        jump();
      }
    });
    window.addEventListener('mousedown', jump);
    window.addEventListener('touchstart', e => {
      e.preventDefault();
      jump();
    }, { passive: false });

    resetGame();
  </script>
</body>
</html>
