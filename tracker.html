<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker de Puntajes</title>
<style>
  :root {
    --primary: #4b3f72;
    --primary-light: #2d2d6b;
    --accent: #ffd166;
    --bg-top: #87ceeb;
    --bg-bottom: #d6f3ff;
    --card-bg: #ffffff;
    --text: #2d2d3a;
    --muted: #6b6b80;
    --border: #e2e2ef;
    --gold: #ffd166;
    --silver: #d9d9e8;
    --bronze: #e8b988;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
  }

  body {
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }

  .page {
    width: 100%;
    max-width: 520px;
  }

  h1 {
    margin: 0 0 4px;
    color: var(--primary-light);
    text-align: center;
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    text-shadow: 1px 1px 0 #fff;
  }

  .subtitle {
    margin: 0 0 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(45, 45, 107, 0.15);
    padding: 20px;
    margin-bottom: 20px;
  }

  form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .field {
    flex: 1 1 140px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: bold;
  }

  input {
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: var(--primary);
  }

  button {
    align-self: flex-end;
    padding: 11px 22px;
    border: none;
    border-radius: 10px;
    background: var(--primary-light);
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:hover {
    background: var(--primary);
  }

  button:active {
    transform: scale(0.97);
  }

  .error {
    color: #c0392b;
    font-size: 0.85rem;
    min-height: 1.1em;
    margin-top: 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 0 10px 10px;
    border-bottom: 2px solid var(--border);
  }

  th.col-score, td.col-score {
    text-align: right;
  }

  th.col-actions, td.col-actions {
    text-align: right;
    width: 40px;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
  }

  tbody tr:last-child {
    border-bottom: none;
  }

  td {
    padding: 12px 10px;
    font-size: 0.98rem;
  }

  .rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-weight: bold;
    font-size: 0.85rem;
    background: var(--border);
    color: var(--muted);
  }

  tr:nth-child(-n+3) .rank {
    background: transparent;
    font-size: 1.2rem;
  }

  .player-name {
    font-weight: bold;
  }

  .score-value {
    font-weight: bold;
    color: var(--primary-light);
  }

  .delete-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 1.1rem;
    padding: 2px 6px;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete-btn:hover {
    background: #fdeeee;
    color: #c0392b;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 24px 10px;
    font-size: 0.95rem;
  }

  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .table-title {
    margin: 0;
    font-size: 1rem;
    font-weight: bold;
    color: var(--primary-light);
  }

  .clear-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .clear-btn:hover {
    background: #fdeeee;
    color: #c0392b;
    border-color: #f3c6c6;
  }

  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 8px;
  }

  .record-card {
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    color: #fff;
    text-align: center;
    padding: 22px 20px;
    box-shadow: 0 10px 28px rgba(45, 45, 107, 0.3);
  }

  .record-label {
    margin: 0;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.85;
  }

  .record-score {
    margin: 6px 0 2px;
    font-size: clamp(2.4rem, 12vw, 3.2rem);
    font-weight: bold;
    line-height: 1;
    text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.15);
  }

  .record-holder {
    margin: 0;
    font-size: 1rem;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>🏆 Tracker de Puntajes</h1>
    <p class="subtitle">Registrá los mejores puntajes de tu juego</p>

    <div class="card record-card" id="record-card" hidden>
      <p class="record-label">Récord actual</p>
      <p class="record-score" id="record-score">0</p>
      <p class="record-holder" id="record-holder"></p>
    </div>

    <div class="card">
      <form id="score-form">
        <div class="field">
          <label for="player-name">Jugador</label>
          <input type="text" id="player-name" placeholder="Nombre" maxlength="30" autocomplete="off">
        </div>
        <div class="field" style="flex: 0 1 120px;">
          <label for="player-score">Puntaje</label>
          <input type="number" id="player-score" placeholder="0" min="0" step="1">
        </div>
        <button type="submit">Agregar</button>
      </form>
      <div class="error" id="form-error"></div>
    </div>

    <div class="card">
      <div class="table-header">
        <p class="table-title">Tabla de puntajes</p>
        <button type="button" class="clear-btn" id="clear-all-btn">Borrar todo</button>
      </div>
      <table>
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th>Jugador</th>
            <th class="col-score">Puntaje</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="score-table-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" hidden>Todavía no hay puntajes cargados.</div>
    </div>

    <p class="footer-note">Los puntajes se guardan en este navegador.</p>
  </div>

<script>
  const STORAGE_KEY = 'gameScores';

  const form = document.getElementById('score-form');
  const nameInput = document.getElementById('player-name');
  const scoreInput = document.getElementById('player-score');
  const errorEl = document.getElementById('form-error');
  const tableBody = document.getElementById('score-table-body');
  const emptyState = document.getElementById('empty-state');
  const recordCard = document.getElementById('record-card');
  const recordScoreEl = document.getElementById('record-score');
  const recordHolderEl = document.getElementById('record-holder');
  const clearAllBtn = document.getElementById('clear-all-btn');

  function loadScores() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function saveScores(scores) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
  }

  function render() {
    const scores = loadScores().sort((a, b) => b.score - a.score);
    tableBody.innerHTML = '';

    if (scores.length === 0) {
      emptyState.hidden = false;
      recordCard.hidden = true;
      return;
    }
    emptyState.hidden = true;

    recordCard.hidden = false;
    recordScoreEl.textContent = scores[0].score;
    recordHolderEl.textContent = `🏆 ${scores[0].name}`;

    const medals = ['🥇', '🥈', '🥉'];

    scores.forEach((entry, index) => {
      const tr = document.createElement('tr');
      const rankLabel = medals[index] || (index + 1);
      tr.innerHTML = `
        <td><span class="rank">${rankLabel}</span></td>
        <td class="player-name"></td>
        <td class="col-score score-value"></td>
        <td class="col-actions"><button class="delete-btn" title="Eliminar" data-id="${entry.id}">✕</button></td>
      `;
      tr.querySelector('.player-name').textContent = entry.name;
      tr.querySelector('.score-value').textContent = entry.score;
      tableBody.appendChild(tr);
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errorEl.textContent = '';

    const name = nameInput.value.trim();
    const score = Number(scoreInput.value);

    if (!name) {
      errorEl.textContent = 'Ingresá el nombre del jugador.';
      return;
    }
    if (scoreInput.value === '' || Number.isNaN(score) || score < 0) {
      errorEl.textContent = 'Ingresá un puntaje válido.';
      return;
    }

    const scores = loadScores();
    scores.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2), name, score });
    saveScores(scores);

    nameInput.value = '';
    scoreInput.value = '';
    nameInput.focus();
    render();
  });

  tableBody.addEventListener('click', (e) => {
    const btn = e.target.closest('.delete-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    const scores = loadScores().filter((entry) => entry.id !== id);
    saveScores(scores);
    render();
  });

  clearAllBtn.addEventListener('click', () => {
    if (loadScores().length === 0) return;
    if (!confirm('¿Borrar todos los puntajes? Esta acción no se puede deshacer.')) return;
    saveScores([]);
    render();
  });

  render();
</script>
</body>
</html>
